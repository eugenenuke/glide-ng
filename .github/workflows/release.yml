name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag / release version (e.g. v0.9.0); defaults to VERSION file'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-ubuntu-22-and-cross:
    name: Ubuntu 22.04 (glibc 2.35) + Win32 + DOS/32
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build & cross-compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake glslang-tools python3 pkg-config \
            libvulkan-dev libegl-dev libgl-dev libgles2-mesa-dev libsdl2-dev \
            libx11-dev libxext-dev libwayland-dev \
            g++-mingw-w64-i686-posix gcc-mingw-w64-i686-posix mingw-w64-tools \
            curl xz-utils zip

      - name: Download Open Watcom v2 (Linux x64) for DOS/32 build
        run: |
          mkdir -p vendor/watcom
          curl -fSL -o /tmp/ow.tar.xz \
            https://github.com/open-watcom/open-watcom-v2/releases/download/Current-build/ow-snapshot.tar.xz
          tar -xJf /tmp/ow.tar.xz -C vendor/watcom
          rm -f /tmp/ow.tar.xz
          chmod +x vendor/watcom/binl64/* vendor/watcom/binl/* 2>/dev/null || true
          test -x vendor/watcom/binl64/wcc386 || test -x vendor/watcom/binl/wcc386

      - name: Configure & build Release (Ubuntu 22.04 + Win32 + DOS/32)
        run: |
          cmake -S . -B build_release \
            -DCMAKE_BUILD_TYPE=Release \
            -DGLIDE_STRICT_WARNINGS=ON \
            -DGLIDE_STATIC_CPP_RUNTIME=ON \
            -Wdev
          cmake --build build_release -j"$(nproc)"

      - name: Stage normalized output archive
        run: |
          mkdir -p stage_ubuntu/{lib,bin,win32_bin,dos}
          cp -L build_release/lib/libglide.so.2.11.0 stage_ubuntu/lib/
          cp -L build_release/lib/libglide2x.so.2.0.0 stage_ubuntu/lib/
          cp -L build_release/lib/libglide3x.so.3.0.0 stage_ubuntu/lib/
          for f in build_release/bin/*; do
            [[ -f "$f" && -x "$f" ]] || continue
            case "$(basename "$f")" in
              *WrapperTests) continue ;;
            esac
            cp "$f" stage_ubuntu/bin/
          done
          cp build_release/win32/bin/*.dll build_release/win32/bin/*.exe stage_ubuntu/win32_bin/
          cp build_release/dos/*.ovl build_release/dos/*.exe stage_ubuntu/dos/

      - name: Upload Ubuntu 22.04, Win32 & DOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-22.04-cross
          path: stage_ubuntu

  build-ubuntu-24:
    name: Ubuntu 24.04 (glibc 2.39) + Catch2 v3 Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build & test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake catch2 glslang-tools python3 pkg-config \
            libvulkan-dev libegl-dev libgl-dev libgles2-mesa-dev libsdl2-dev \
            libx11-dev libxext-dev libwayland-dev \
            mesa-vulkan-drivers libgl1-mesa-dri libegl-mesa0 libgles2

      - name: Configure & build Release (Ubuntu 24.04)
        run: |
          cmake -S . -B build_u24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGLIDE_BUILD_WIN32=OFF \
            -DGLIDE_STRICT_WARNINGS=ON \
            -DGLIDE_STATIC_CPP_RUNTIME=ON \
            -Wdev
          cmake --build build_u24 -j"$(nproc)"

      - name: Run headless Catch2 test suite
        env:
          GLIDE_NG_HEADLESS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          ctest --test-dir build_u24 --output-on-failure -j2 || \
            ctest --test-dir build_u24 --rerun-failed --output-on-failure

      - name: Stage Ubuntu 24.04 output
        run: |
          mkdir -p stage_u24/{lib,bin}
          cp -L build_u24/lib/libglide.so.2.11.0 stage_u24/lib/
          cp -L build_u24/lib/libglide2x.so.2.0.0 stage_u24/lib/
          cp -L build_u24/lib/libglide3x.so.3.0.0 stage_u24/lib/
          for f in build_u24/bin/*; do
            [[ -f "$f" && -x "$f" ]] || continue
            case "$(basename "$f")" in
              *WrapperTests) continue ;;
            esac
            cp "$f" stage_u24/bin/
          done

      - name: Upload Ubuntu 24.04 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-24.04
          path: stage_u24

  build-fedora:
    name: Fedora 41 (x86_64) + Catch2 v3 Tests
    runs-on: ubuntu-24.04
    container:
      image: fedora:41
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y \
            git gcc-c++ cmake make pkgconf-pkg-config python3 glslang \
            catch-devel libstdc++-static binutils \
            vulkan-headers vulkan-loader-devel \
            mesa-libEGL-devel mesa-libGLES-devel mesa-vulkan-drivers mesa-dri-drivers \
            SDL2-devel libX11-devel libXext-devel wayland-devel

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure & build Release (Fedora 41)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -S . -B build_fedora \
            -DCMAKE_BUILD_TYPE=Release \
            -DGLIDE_BUILD_WIN32=OFF \
            -DGLIDE_STRICT_WARNINGS=ON \
            -DGLIDE_STATIC_CPP_RUNTIME=ON \
            -Wdev
          cmake --build build_fedora -j"$(nproc)"

      - name: Run headless Catch2 test suite
        env:
          GLIDE_NG_HEADLESS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          ctest --test-dir build_fedora --output-on-failure -j2 || \
            ctest --test-dir build_fedora --rerun-failed --output-on-failure

      - name: Stage Fedora output
        run: |
          mkdir -p stage_fedora/{lib,bin}
          cp -L build_fedora/lib/libglide.so.2.11.0 stage_fedora/lib/
          cp -L build_fedora/lib/libglide2x.so.2.0.0 stage_fedora/lib/
          cp -L build_fedora/lib/libglide3x.so.3.0.0 stage_fedora/lib/
          for f in build_fedora/bin/*; do
            [[ -f "$f" && -x "$f" ]] || continue
            case "$(basename "$f")" in
              *WrapperTests) continue ;;
            esac
            cp "$f" stage_fedora/bin/
          done

      - name: Upload Fedora artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fedora-41
          path: stage_fedora

  build-arch:
    name: Arch Linux / CachyOS (x86_64 rolling) + Catch2 v3 Tests
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git cmake python glslang catch2 \
            vulkan-headers vulkan-icd-loader vulkan-swrast mesa sdl2 \
            libx11 libxext wayland pkgconf

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure & build Release (Arch / CachyOS)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -S . -B build_arch \
            -DCMAKE_BUILD_TYPE=Release \
            -DGLIDE_BUILD_WIN32=OFF \
            -DGLIDE_STRICT_WARNINGS=ON \
            -DGLIDE_STATIC_CPP_RUNTIME=ON \
            -Wdev
          cmake --build build_arch -j"$(nproc)"

      - name: Run headless Catch2 test suite
        env:
          GLIDE_NG_HEADLESS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          ctest --test-dir build_arch --output-on-failure -j2 || \
            ctest --test-dir build_arch --rerun-failed --output-on-failure

      - name: Stage Arch output
        run: |
          mkdir -p stage_arch/{lib,bin}
          cp -L build_arch/lib/libglide.so.2.11.0 stage_arch/lib/
          cp -L build_arch/lib/libglide2x.so.2.0.0 stage_arch/lib/
          cp -L build_arch/lib/libglide3x.so.3.0.0 stage_arch/lib/
          for f in build_arch/bin/*; do
            [[ -f "$f" && -x "$f" ]] || continue
            case "$(basename "$f")" in
              *WrapperTests) continue ;;
            esac
            cp "$f" stage_arch/bin/
          done

      - name: Upload Arch artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arch
          path: stage_arch

  package-and-release:
    name: Package & Publish GitHub Release
    runs-on: ubuntu-22.04
    needs: [build-ubuntu-22-and-cross, build-ubuntu-24, build-fedora, build-arch]
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils binutils-mingw-w64-i686 zip xz-utils

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ci_artifacts

      - name: Package release archives
        run: |
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          VER="${TAG_NAME#v}"
          if [[ -z "${VER}" || "${VER}" == "main" ]]; then
            VER="$(tr -d '[:space:]' < VERSION)"
          fi
          chmod +x scripts/package_release.sh
          scripts/package_release.sh \
            --version "${VER}" \
            --win32-bin ci_artifacts/ubuntu-22.04-cross/win32_bin \
            --dos-dir ci_artifacts/ubuntu-22.04-cross/dos \
            --linux-flavor "ubuntu-22.04:ci_artifacts/ubuntu-22.04-cross/lib:ci_artifacts/ubuntu-22.04-cross/bin" \
            --linux-flavor "ubuntu-24.04:ci_artifacts/ubuntu-24.04/lib:ci_artifacts/ubuntu-24.04/bin" \
            --linux-flavor "fedora-41:ci_artifacts/fedora-41/lib:ci_artifacts/fedora-41/bin" \
            --linux-flavor "arch:ci_artifacts/arch/lib:ci_artifacts/arch/bin" \
            --out-dir dist

      - name: Upload combined release artifact
        uses: actions/upload-artifact@v4
        with:
          name: glide-ng-release-archives
          path: dist/*

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
          else
            gh release create "${TAG}" dist/* \
              --title "glide-ng ${TAG}" \
              --generate-notes
          fi
