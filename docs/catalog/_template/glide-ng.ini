# ==============================================================================
# glide-ng Title Preset Template
# Copy to `glide-ng.ini` next to the game/demo executable, or pass:
#   GLIDE_NG_CONFIG=/path/to/glide-ng.ini
# ==============================================================================

[core]
# vulkan | opengl_es | software
backend = vulkan

[hardware]
# Emulated card: VoodooGraphics | VoodooRush | Voodoo2 | VoodooBanshee |
#                Voodoo3 | Voodoo4 | Voodoo5
# Omit api_version to use the card's authentic default (Voodoo2: 2.56 / 3.03).
card_model = Voodoo2

[display]
vsync = true
max_fps = 60

[glide]
# Uncomment title-specific overrides as needed:
# gamma = 1.7                # Classic 1996-1997 SST-1 (Voodoo1) RAMDAC lift
# no_splash = true           # Skip 3dfx startup splash screen
# ignore_reopen = true       # Guard against redundant grSstWinOpen calls
# force_bilinear = false
