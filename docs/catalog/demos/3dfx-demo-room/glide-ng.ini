# ==============================================================================
# glide-ng Preset: 3dfx Demo Room (demoroom.exe)
# Authentic 1996/1997 Voodoo Graphics (SST-1) profile with RAMDAC gamma = 1.7.
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = VoodooGraphics
api_version = 2.48

[display]
vsync = true
max_fps = 60

[glide]
# Authentic SST-1 RAMDAC gamma curve — prevents PROJBLUE.3DF startup scene from crushing to near-black
gamma = 1.7
