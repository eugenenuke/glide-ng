# ==============================================================================
# glide-ng Preset: 3dfx Kitty Hawk (aademo.exe — Voodoo5 4x Spatial AA)
# Launch with: -res 1024x768 -pixfmt aa4rgb565 -model 'data\kittyhawk\kittyhawk.gxf'
# ==============================================================================

[core]
backend = vulkan

[hardware]
# Required so GR_EXTENSION advertises PIXEXT and grSstWinOpenExt enables 4x Spatial AA
card_model = Voodoo5
api_version = 3.10

[display]
vsync = true
max_fps = 60

[glide]
gamma = 1.0
