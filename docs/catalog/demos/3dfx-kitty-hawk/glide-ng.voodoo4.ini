# ==============================================================================
# glide-ng Preset: 3dfx Kitty Hawk (aademo.exe — Voodoo4 2x Spatial AA)
# Launch with: -res 1024x768 -pixfmt aa2rgb565 -model 'data\kittyhawk\kittyhawk.gxf'
# ==============================================================================

[core]
backend = vulkan

[hardware]
# Single VSA-100 profile (32 MB UMA, 2x Spatial AA cap)
card_model = Voodoo4
api_version = 3.10

[display]
vsync = true
max_fps = 60

[glide]
gamma = 1.0
