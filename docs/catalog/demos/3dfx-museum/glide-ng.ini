# ==============================================================================
# glide-ng Preset: 3dfx Museum (museum.exe — Voodoo5 4x AA + Soft Reflectance)
# Launch with: -res 1024x768 -pixfmt aa4rgb565 -model 'data\DistressedMuseum\museum.gxf'
# ==============================================================================

[core]
backend = vulkan

[hardware]
# Required so GR_EXTENSION advertises PIXEXT for 4-sample T-Buffer Soft Reflectance
card_model = Voodoo5
api_version = 3.10

[display]
vsync = true
max_fps = 60

[glide]
gamma = 1.0
