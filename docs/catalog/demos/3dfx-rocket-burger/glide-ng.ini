# ==============================================================================
# glide-ng Preset: 3dfx Rocket Burger (RocketBurger.exe — Voodoo5 T-Buffer)
# Launch with: -res 640x480 -pixfmt aa4rgb565 -model 'data\small tgas\scene.gxf'
# ==============================================================================

[core]
backend = vulkan

[hardware]
# Required so GR_EXTENSION advertises PIXEXT for 4x AA, Depth of Field & Motion Blur
card_model = Voodoo5
api_version = 3.10

[display]
vsync = true
max_fps = 60

[glide]
gamma = 1.0
