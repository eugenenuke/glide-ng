# ==============================================================================
# glide-ng Preset: 3dfx Surf (surf_glide2x.exe & surf_glide3x.exe)
# Omit api_version so Glide 2.x uses 2.56 and Glide 3.x uses 3.03 cleanly.
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2

[display]
vsync = true
max_fps = 60

[glide]
gamma = 1.0
