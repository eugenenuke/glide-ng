# ==============================================================================
# glide-ng Preset: Archimedean Dynasty — Enhanced Visuals (4x MSAA + Linear)
# Recommended for: AD3DFX.EXE at 640x480x16 on hardware Vulkan / OpenGL ES GPUs
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = VoodooGraphics
api_version = 2.48

[display]
vsync = true
max_fps = 60
# 4x hardware MSAA smooths 3D silhouette edges on underwater stations, towers,
# and submarine hulls while preserving the ZA16 cockpit depth mask cleanly
msaa = 4
presentation_filter = linear

[glide]
# Suppress hardware 4x4 dithering subtraction for smoother dark-blue ocean fog gradients
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
