# ==============================================================================
# glide-ng Preset: Archimedean Dynasty (1996 / 1997 3dfx Patch — DOS 3dfx)
# Recommended for: AD3DFX.EXE (v1.120 3dfx patch) on Vulkan / OpenGL ES
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = VoodooGraphics
api_version = 2.48

[display]
vsync = true
max_fps = 60

[glide]
# The game runs with its own in-game Shift+F3 gamma control on Voodoo Graphics.
# Uncomment to brighten deep-sea fog globally via the host RAMDAC LUT:
# gamma = 1.4
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
