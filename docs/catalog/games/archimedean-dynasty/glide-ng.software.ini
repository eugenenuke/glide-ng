# ==============================================================================
# glide-ng Preset: Archimedean Dynasty — CPU Software Rasterizer (AVX-512 / AVX2)
# Recommended for: AD3DFX.EXE on hosts without a hardware GPU
# ==============================================================================

[core]
backend = software

[software]
# Auto-selects AVX-512 (Zen 4+) -> AVX2 -> Scalar
simd = auto
# Uncomment for 2x2 supersampled anti-aliasing at 640x480:
# aa = ssaa

[hardware]
card_model = VoodooGraphics
api_version = 2.48

[display]
vsync = true
max_fps = 60

[glide]
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
