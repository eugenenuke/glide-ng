# ==============================================================================
# glide-ng Preset: Blood (3dfx Voodoo Patch — 3DFX.EXE)
# Recommended for: 3DFX.EXE (Build Engine 3dfx v1.0i / Blood 1.20 Beta) under DOSBox
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = VoodooGraphics
api_version = 2.48

[display]
vsync = true
max_fps = 60
# Keep msaa = 1: Blood's 3dfx Build Engine draws floors and ceilings as 1-pixel
# right-triangle scanline strips without calling grBufferClear() in-game. Higher
# MSAA sample counts leave un-overwritten subsamples from prior frames.
msaa = 1
presentation_filter = nearest

[glide]
# Keep full 24-bit color precision for smooth Build Engine shade palettes.
no_dither_sub = true
# Set BUILD_GAMMA=1 in DOSBox autoexec to match original DOS Software lighting
# (default 3DFX.EXE bakes a strong 1997 CRT brightness curve into its palettes).
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
