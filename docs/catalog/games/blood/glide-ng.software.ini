# ==============================================================================
# glide-ng Preset: Blood (Software CPU Backend Fallback)
# Recommended for: Systems without hardware Vulkan/GLES GPUs (faster than llvmpipe)
# ==============================================================================

[core]
backend = software

[hardware]
card_model = VoodooGraphics
api_version = 2.48

[display]
vsync = true
max_fps = 60
msaa = 1
presentation_filter = nearest

[glide]
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
