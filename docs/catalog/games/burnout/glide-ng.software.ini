# ==============================================================================
# glide-ng Preset: Burnout: Championship Drag Racing — CPU Software
# Recommended for: BURNOUT.EXE on hosts without a hardware GPU
# ==============================================================================

[core]
backend = software

[software]
# Auto-selects AVX-512 (Zen 4+) -> AVX2 -> Scalar
simd = auto
# Uncomment for 2x2 supersampled anti-aliasing (smooths chain-link fences):
# aa = ssaa

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60

[glide]
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
