# ==============================================================================
# glide-ng Preset: Carmageddon — Enhanced Visuals (4x MSAA + Linear + No Dither)
# Recommended for: Voodo2C.exe / voodo2S.exe / CARMAV.EXE on Vulkan / OpenGL ES
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60
# 4x hardware MSAA smooths 3D silhouettes (roof blade, fenders, rooflines)
# while keeping the 2D LFB cockpit, Pratcam, and HUD crisp
msaa = 4
presentation_filter = linear

[glide]
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
