# ==============================================================================
# glide-ng Preset: CyberGladiators — Enhanced Visuals (4x MSAA + Linear)
# Recommended for: CYBER.EXE with glide.dll on Vulkan / OpenGL 3.3 Core (WGL)
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = VoodooGraphics
api_version = 2.11

[display]
vsync = true
max_fps = 60
# 4x hardware MSAA smooths polygonal fighter silhouettes, spikes, and limbs
# while keeping the 2D HUD bars and countdown timer crisp
msaa = 4
presentation_filter = linear

[glide]
# Preserves full 24-bit color precision on metallic Gouraud lighting gradients
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
