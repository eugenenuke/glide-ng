# ==============================================================================
# glide-ng Preset: CyberGladiators (1996 — Win32 3dfx Glide 2.11)
# Recommended for: CYBER.EXE with glide.dll on Vulkan / OpenGL 3.3 Core (WGL)
# ==============================================================================

[core]
backend = vulkan

[hardware]
# Authentic 1996 Voodoo Graphics (SST-1: 4 MB FB, 1x 2 MB TMU) + Glide 2.11.
# Also the built-in default of glide.dll / libglide.so when omitted.
card_model = VoodooGraphics
api_version = 2.11

[display]
vsync = true
max_fps = 60

[glide]
# CYBER.EXE sets grGammaCorrectionValue(1.6) natively at startup (and adjusts
# gamma live via Space -> \), so no gamma override is needed here.
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
