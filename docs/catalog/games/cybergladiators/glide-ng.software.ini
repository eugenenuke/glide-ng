# ==============================================================================
# glide-ng Preset: CyberGladiators — CPU Software Rasterizer (AVX-512 / AVX2)
# Recommended for: CYBER.EXE on hosts without a 32-bit hardware GPU / Vulkan ICD
# ==============================================================================

[core]
backend = software

[software]
# Auto-selects AVX-512 (Zen 4+) -> AVX2 -> Scalar
simd = auto
# Uncomment for 2x2 supersampled anti-aliasing (~4.5 ms/frame, locked 60 FPS):
# aa = ssaa

[hardware]
card_model = VoodooGraphics
api_version = 2.11

[display]
vsync = true
max_fps = 60

[glide]
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
