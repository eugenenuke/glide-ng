# ==============================================================================
# glide-ng Preset: Descent II — Enhanced (4x MSAA)
# Recommended for: D2_3DFX.EXE (640x480x16) on Vulkan / OpenGL ES
# Note: Keep max_fps = 60 per D2_3DFX.TXT to avoid timing glitches above 60 Hz.
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60
msaa = 4
presentation_filter = linear

[glide]
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
