# ==============================================================================
# glide-ng Preset: Descent II (1996 — DOS 3dfx)
# Recommended for: D2_3DFX.EXE (Release 6 dynamic GLIDE2X.OVL build for Voodoo2+)
# Note: Official D2_3DFX.TXT warns timing issues can appear above 60 Hz.
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60

[glide]
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
