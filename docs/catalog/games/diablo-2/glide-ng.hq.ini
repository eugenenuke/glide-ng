# ==============================================================================
# glide-ng Preset: Diablo II (2000 — HQ / 4x MSAA + Linear Presentation)
# Recommended for: Game.exe -3dfx (v1.13d) on hardware Vulkan GPUs
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2
api_version = 3.03

[display]
vsync = true
max_fps = 60
msaa = 4
presentation_filter = linear

[glide]
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
