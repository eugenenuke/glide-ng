# ==============================================================================
# glide-ng Preset: Diablo II (2000 — Win32 Glide 3.x)
# Recommended for: Game.exe -3dfx (v1.13d) with D2Glide.dll -> glide3x.dll
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2
api_version = 3.03

[display]
vsync = true
max_fps = 60
msaa = 1
presentation_filter = nearest

[glide]
# Keep gamma app-controlled (D2 calls grLoadGammaTable directly) and preserve
# full 24-bit color without 16-bit dither subtraction.
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
