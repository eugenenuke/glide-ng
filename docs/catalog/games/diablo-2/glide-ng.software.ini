# ==============================================================================
# glide-ng Preset: Diablo II (2000 — Software Reference Backend)
# Recommended for: Hosts without a 32-bit hardware Vulkan / OpenGL driver
# ==============================================================================

[core]
backend = software

[hardware]
card_model = Voodoo2
api_version = 3.03

[display]
vsync = true
max_fps = 60
msaa = 1
presentation_filter = nearest

[glide]
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
