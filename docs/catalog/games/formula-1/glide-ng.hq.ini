# ==============================================================================
# glide-ng Preset: Formula 1 (1997 — HQ / 4x MSAA)
# Recommended for: f1win.exe with crisp smoothed road markings and catch-fencing
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60
msaa = 4
presentation_filter = linear

[glide]
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
