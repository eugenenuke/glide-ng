# ==============================================================================
# glide-ng Preset: Formula 1 (1997 — Win32 Glide 2.x, Psygnosis)
# Recommended for: f1win.exe (Bizarre Creations / Psygnosis)
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60
msaa = 1
presentation_filter = nearest

[glide]
no_dither_sub = true
# Uncomment for classic 1997 SST-1 brighter menu gamma (1.3-1.7):
# gamma = 1.7
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
