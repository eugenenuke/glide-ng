[core]
backend = software

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60
msaa = 1
presentation_filter = nearest

[software]
simd = avx2

[glide]
no_dither_sub = true
# no_splash = true
