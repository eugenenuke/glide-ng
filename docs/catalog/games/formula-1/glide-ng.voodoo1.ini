# ==============================================================================
# glide-ng Preset: Formula 1 (1997 — Voodoo Graphics SST-1 Profile)
# Recommended for: authentic single-TMU 1997 Voodoo1 profile (Glide 2.48)
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = VoodooGraphics
api_version = 2.48

[display]
vsync = true
max_fps = 60
msaa = 1
presentation_filter = nearest

[glide]
no_dither_sub = true
# Authentic Voodoo Graphics SST-1 default RAMDAC LUT curve (optional):
# gamma = 1.7
# no_splash = true
