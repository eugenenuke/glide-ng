# ==============================================================================
# glide-ng Preset: Grand Theft Auto — Enhanced Visuals (4x MSAA + Linear)
# Recommended for: GTAFX.EXE at 800x600x16 (press F11 in-game) on Vulkan / GLES
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60
# 4x hardware MSAA smooths diagonal signage, perspective building edges,
# rotated vehicles, and the mission arrow while keeping the 2D LFB HUD crisp
msaa = 4
presentation_filter = linear

[glide]
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
