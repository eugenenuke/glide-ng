# ==============================================================================
# glide-ng Preset: Grand Theft Auto — CPU Software Rasterizer (AVX-512 / AVX2)
# Recommended for: GTAFX.EXE on hosts without a hardware GPU (supports 800x600)
# ==============================================================================

[core]
backend = software

[software]
# Auto-selects AVX-512 (Zen 4+) -> AVX2 -> Scalar
simd = auto
# Uncomment for 2x2 supersampled anti-aliasing (still ~130+ FPS uncapped at 800x600):
# aa = ssaa

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60

[glide]
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
