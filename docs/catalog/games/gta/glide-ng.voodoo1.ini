[core]
backend = vulkan

[hardware]
# Authentic 1997 SST-1 profile (4 MB FB, 1x 2 MB TMU, Glide 2.48 >= 2.42 req)
card_model = VoodooGraphics
api_version = 2.48

[display]
vsync = true
max_fps = 60

[glide]
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
