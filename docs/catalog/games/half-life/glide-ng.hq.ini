# ==============================================================================
# glide-ng Preset: Half-Life — HQ / 4x MSAA + Linear (Voodoo2, gamma = 1.3)
# Recommended for hardware Vulkan GPUs at 800x600 / 1024x768 (3dfxgl.dll)
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60
msaa = 4
presentation_filter = linear

[glide]
gamma = 1.3
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
