# ==============================================================================
# glide-ng Preset: Half-Life — Authentic Baseline (Voodoo2, 1x, gamma = 1.3)
# Verified with Half-Life v1.1.1.0 + gldrv/3dfxgl.dll (Voodoo2 MiniGL)
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60
msaa = 1
presentation_filter = nearest

[glide]
gamma = 1.3
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
