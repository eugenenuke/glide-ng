# ==============================================================================
# glide-ng Preset: Half-Life — Voodoo Graphics / SST-1 (2.48, 640x480)
# Single-TMU fallback profile matching 1996-1997 Voodoo1 accelerators
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = VoodooGraphics
api_version = 2.48

[display]
vsync = true
max_fps = 60
msaa = 1
presentation_filter = linear

[glide]
gamma = 1.3
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
