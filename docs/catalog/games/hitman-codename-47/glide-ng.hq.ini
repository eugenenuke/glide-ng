# ==============================================================================
# glide-ng Preset: Hitman: Codename 47 (2000 — HQ / 4x MSAA)
# Recommended for: Hitman.exe with Resolution 1024x768 in Hitman.ini
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo5
api_version = 3.10

[display]
vsync = true
max_fps = 60
msaa = 4
presentation_filter = linear

[glide]
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
