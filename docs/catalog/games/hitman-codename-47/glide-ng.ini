# ==============================================================================
# glide-ng Preset: Hitman: Codename 47 (2000 — Win32 Glide 3.x)
# Recommended for: Hitman.exe with DrawDll Render3DFX.dll + glide3x.dll
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo5
api_version = 3.10

[display]
vsync = true
max_fps = 60
msaa = 1
presentation_filter = nearest

[glide]
# Keep gamma app-controlled (linear 1.0 default) and preserve full 24-bit color
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
