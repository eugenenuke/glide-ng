# ==============================================================================
# glide-ng Preset: Interstate '76 Gold Edition — High Quality (4x MSAA + Linear)
# Recommended for: I76.EXE /glide (Vulkan / OpenGL 3.3 Core WGL)
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60
msaa = 4
presentation_filter = linear

[glide]
no_dither_sub = true
# Uncomment to skip the automatic 3dfx startup splash animation:
# no_splash = true
