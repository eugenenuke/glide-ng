# ==============================================================================
# glide-ng Preset: Interstate '76 Gold Edition — CPU Software Rasterizer
# Zero-GPU fallback with AVX2/AVX-512 SIMD + 2x2 SSAA anti-aliasing
# ==============================================================================

[core]
backend = software

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60
presentation_filter = linear

[software]
# Uncomment 'aa = ssaa' for 2x2 supersampled anti-aliasing (or 'none' for speed)
aa = ssaa

[glide]
no_dither_sub = true
