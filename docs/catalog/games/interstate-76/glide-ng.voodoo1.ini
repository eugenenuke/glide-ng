# ==============================================================================
# glide-ng Preset: Interstate '76 Gold Edition — Authentic Voodoo1 (SST-1)
# Emulates an original 4 MB / 1x 2 MB TMU 3dfx Voodoo Graphics accelerator
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = VoodooGraphics
api_version = 2.48

[display]
vsync = true
max_fps = 60
msaa = 1
presentation_filter = nearest

[glide]
# Leave stock 16-bit dithering behavior for authentic 1997 SST-1 look:
no_dither_sub = false
