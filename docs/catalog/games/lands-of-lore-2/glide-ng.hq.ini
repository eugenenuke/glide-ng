# ==============================================================================
# glide-ng Preset: Lands of Lore: Guardians of Destiny — Enhanced Visuals
# Recommended for: LOLG.EXE (v1.30e) on hardware Vulkan / OpenGL ES GPUs
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60
msaa = 4
presentation_filter = linear

[glide]
# Smooth 24-bit dungeon rock and sky gradients without 16-bit dither banding
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
