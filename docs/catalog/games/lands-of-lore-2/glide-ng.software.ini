# ==============================================================================
# glide-ng Preset: Lands of Lore: Guardians of Destiny — CPU Software Rasterizer
# Recommended for: LOLG.EXE (v1.30e) on hosts without a hardware GPU
# ==============================================================================

[core]
backend = software

[software]
# Auto-selects AVX-512 (Zen 4+) -> AVX2 -> Scalar
simd = auto
# Uncomment for 2x2 supersampled anti-aliasing at 640x480:
# aa = ssaa

[hardware]
card_model = VoodooGraphics
api_version = 2.48

[display]
vsync = true
max_fps = 60

[glide]
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
