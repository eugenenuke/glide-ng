# ==============================================================================
# glide-ng Preset: Jane's Longbow 2 — High Quality (4x MSAA + Linear)
# Smooths rotor and fuselage edges in exterior views; note subtle 1 px hairline
# along static 256x256 cockpit panel tile borders under 4x MSAA.
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60
msaa = 4
presentation_filter = linear

[glide]
no_dither_sub = true
# Uncomment to brighten sunrise terrain / fog closer to 3dfx CRT RAMDAC defaults:
# gamma = 1.3
# Uncomment to skip the automatic 3dfx startup splash animation:
# no_splash = true
