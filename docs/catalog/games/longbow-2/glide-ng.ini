# ==============================================================================
# glide-ng Preset: Jane's Longbow 2 (1997 — Win32 Glide 2.x)
# Recommended for: LB2.EXE / FLIGHT3.DLE (glide2x.dll, seamless 2D cockpit tiles)
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60
msaa = 1
presentation_filter = nearest

[glide]
no_dither_sub = true
# Uncomment to override the game's default grGammaCorrectionValue(0.9):
# gamma = 1.3
# Uncomment to skip the automatic 3dfx startup splash animation:
# no_splash = true
