# ==============================================================================
# glide-ng Preset: Jane's Longbow 2 — CPU Software Rasterizer
# Zero-GPU fallback with AVX2/AVX-512 SIMD (aa = none keeps 2D cockpit seamless;
# switch to aa = ssaa for 2x2 supersampled anti-aliasing in exterior views)
# ==============================================================================

[core]
backend = software

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60
presentation_filter = linear

[software]
# Use 'ssaa' for smooth rotors/edges, or 'none' for speed and zero cockpit tile seam:
aa = ssaa

[glide]
no_dither_sub = true
