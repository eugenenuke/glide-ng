# ==============================================================================
# glide-ng Preset: MDK (1997) — Enhanced Visuals (HQ)
# Recommended for: MDK3DFX.EXE on hardware Vulkan / OpenGL ES GPUs
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60
msaa = 4
presentation_filter = linear

[glide]
gamma = 1.0
# Full 24-bit color depth removes banding across glowing skies & spotlights
no_dither_sub = true
# Uncomment to suppress the animated 3dfx startup splash:
# no_splash = true
