# ==============================================================================
# glide-ng Preset: MDK (1997 — Win32 3dfx Patch, MDK3DFX.EXE)
# Authentic single-TMU Voodoo Graphics (SST-1) baseline for Glide 2.x
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = VoodooGraphics
api_version = 2.48

[display]
vsync = true
max_fps = 60

[glide]
# MDK3DFX calls grGammaCorrectionValue(1.0) continuously per frame
gamma = 1.0
# Uncomment to suppress the animated 3dfx startup splash:
# no_splash = true
