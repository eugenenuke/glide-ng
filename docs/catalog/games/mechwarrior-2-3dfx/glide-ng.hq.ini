# ==============================================================================
# glide-ng Preset: MechWarrior 2 — 3Dfx Edition (1996, Enhanced HQ / 4x MSAA)
# Recommended for: MW2.DLL (Glide 2.11) on hardware Vulkan / OpenGL GPUs
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = VoodooGraphics
api_version = 2.11

[display]
vsync = true
max_fps = 60
msaa = 4
presentation_filter = linear

[glide]
gamma = 1.0
# Full 24-bit sky-dome cloud and terrain lighting gradients without 16-bit banding
no_dither_sub = true
# Uncomment to skip the animated 3dfx startup splash:
# no_splash = true
