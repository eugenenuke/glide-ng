# ==============================================================================
# glide-ng Preset: MechWarrior 2: 31st Century Combat — 3Dfx Edition (1996)
# Authentic 3dfx Voodoo Graphics (SST-1, 4 MB FB, 1x 2 MB TMU) for glide.dll
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = VoodooGraphics
api_version = 2.11

[display]
vsync = true
max_fps = 60
msaa = 1
presentation_filter = nearest

[glide]
gamma = 1.0
# Uncomment to skip the animated 3dfx startup splash:
# no_splash = true
