# ==============================================================================
# glide-ng Preset: MechWarrior 2 — 3Dfx Edition (1996, Pure CPU Software)
# Recommended when no hardware Vulkan / OpenGL GPU driver is available
# ==============================================================================

[core]
backend = software

[hardware]
card_model = VoodooGraphics
api_version = 2.11

[display]
vsync = true
max_fps = 60
msaa = 1

[software]
# Automatic SIMD dispatch (AVX-512 -> AVX2+FMA -> Scalar)
simd = auto
# Uncomment for 2x2 supersampled anti-aliasing (slower on low core counts):
# aa = ssaa

[glide]
gamma = 1.0
no_dither_sub = true
# Uncomment to skip the animated 3dfx startup splash:
# no_splash = true
