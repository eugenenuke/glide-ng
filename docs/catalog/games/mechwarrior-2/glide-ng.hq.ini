# ==============================================================================
# glide-ng Preset: MechWarrior 2 (Titanium Edition) — Enhanced Visuals (HQ)
# Recommended for: plugin/zglide.dll on hardware Vulkan / OpenGL ES GPUs
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60
msaa = 4
presentation_filter = linear

[glide]
gamma = 1.0
# Full 24-bit sky and distance-fog gradients without 16-bit dither banding
no_dither_sub = true
# Uncomment to suppress the animated 3dfx startup splash:
# no_splash = true
