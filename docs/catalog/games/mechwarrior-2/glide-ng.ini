# ==============================================================================
# glide-ng Preset: MechWarrior 2: 31st Century Combat (Titanium Edition, 1998)
# Authentic 3dfx Voodoo2 (CVG) baseline for Win32 plugin/zglide.dll (Glide 2.x)
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60

[glide]
# Titanium Edition targets linear 16-bit gamma curves out of the box
gamma = 1.0
# Uncomment to suppress the animated 3dfx startup splash:
# no_splash = true
