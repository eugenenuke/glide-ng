# ==============================================================================
# glide-ng Preset: MechWarrior 2 (Titanium Edition) — Pure CPU Software
# Recommended when no hardware Vulkan / OpenGL GPU driver is available
# ==============================================================================

[core]
backend = software

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60

[software]
# Automatic SIMD dispatch (AVX-512 -> AVX2+FMA -> Scalar)
simd = auto
# Uncomment for 2x2 supersampled anti-aliasing (slower on low core counts):
# aa = ssaa

[glide]
gamma = 1.0
no_dither_sub = true
# Uncomment to suppress the animated 3dfx startup splash:
# no_splash = true
