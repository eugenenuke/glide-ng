# ==============================================================================
# glide-ng Preset: MechWarrior 2 (Titanium Edition) — Voodoo Graphics (SST-1)
# Authentic single-TMU Voodoo1 hardware profile
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = VoodooGraphics
api_version = 2.48

[display]
vsync = true
max_fps = 60

[glide]
gamma = 1.0
