# ==============================================================================
# glide-ng Preset: Messiah (2000 — Voodoo5 / VSA-100 PIXEXT 4x AA HQ Profile)
# MessiahGlide3x.exe v1.2 detects VSA-100 PIXEXT + TEXFMT and opens
# grSstWinOpenExt(..., GR_PIXFMT_AA_4_ARGB_8888) natively for 4x FSAA!
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo5
api_version = 3.10

[display]
vsync = true
max_fps = 60
msaa = 4
presentation_filter = linear

[glide]
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
