# ==============================================================================
# glide-ng Preset: Messiah (2000 — Win32 Glide 3.x)
# Recommended for: MessiahGlide3x.exe (v1.2) -> glide3x.dll
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2
api_version = 3.03

[display]
vsync = true
max_fps = 60
msaa = 1
presentation_filter = nearest

[glide]
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
