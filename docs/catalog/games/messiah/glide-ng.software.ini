# ==============================================================================
# glide-ng Preset: Messiah (2000 — CPU Software Rasterizer, 2x2 SSAA)
# Zero-GPU fallback using AVX2/AVX-512 SIMD with dynamic palette caching
# ==============================================================================

[core]
backend = software

[hardware]
card_model = Voodoo2
api_version = 3.03

[display]
vsync = true
max_fps = 60
presentation_filter = linear

[software]
# Use 'ssaa' for smooth edges (or 'none' for lower CPU load / higher FPS):
aa = ssaa

[glide]
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
