# ==============================================================================
# glide-ng Preset: Messiah (2000 — Authentic Voodoo3 Profile)
# Recommended for: Single-board 16 MB Voodoo3 (Glide 3.10) compatibility
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo3
api_version = 3.10

[display]
vsync = true
max_fps = 60
msaa = 1
presentation_filter = nearest

[glide]
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
