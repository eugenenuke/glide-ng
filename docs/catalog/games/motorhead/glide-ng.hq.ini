# ==============================================================================
# glide-ng Preset: Motorhead — High Quality (4x MSAA + Linear)
# Smooths metallic car chassis edges, track railings, and horizon gantries at
# 800x600 with full taillight/lamp halos and hexagonal lens flares.
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60
msaa = 4
presentation_filter = linear

[glide]
no_dither_sub = true
# Uncomment for warmer CRT-like Voodoo2 RAMDAC gamma curve:
# gamma = 1.3
# Uncomment to skip the automatic 3dfx startup splash animation:
# no_splash = true
