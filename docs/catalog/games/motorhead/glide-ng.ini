# ==============================================================================
# glide-ng Preset: Motorhead (1998 — Win32 Glide 2.x)
# Recommended for: motor.exe (v3.0 / p3.1, Renderer = voodoo, 800x600 / 640x480)
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60
msaa = 1
presentation_filter = linear

[glide]
no_dither_sub = true
# Uncomment for warmer CRT-like Voodoo2 RAMDAC gamma curve:
# gamma = 1.3
# Uncomment to skip the automatic 3dfx startup splash animation:
# no_splash = true
