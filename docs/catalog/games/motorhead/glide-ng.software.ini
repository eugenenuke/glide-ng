# ==============================================================================
# glide-ng Preset: Motorhead — CPU Software Rasterizer (2x2 SSAA)
# Zero-GPU fallback using AVX2/AVX-512 SIMD with full 16-bit aux depth queries
# for volumetric headlight/taillight halos and sun lens flares.
# ==============================================================================

[core]
backend = software

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60
presentation_filter = linear

[software]
# Use 'ssaa' for smooth edges (or 'none' for lower CPU load / higher FPS):
aa = ssaa

[glide]
no_dither_sub = true
