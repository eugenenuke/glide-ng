# ==============================================================================
# glide-ng Preset: Motorhead — Authentic Voodoo1 (SST-1)
# Emulates an original 4 MB / 1x 2 MB TMU 3dfx Voodoo Graphics card (640x480)
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = VoodooGraphics
api_version = 2.48

[display]
vsync = true
max_fps = 60
msaa = 1
presentation_filter = nearest

[glide]
# Leave stock 16-bit dithering enabled for authentic 1997 SST-1 output:
no_dither_sub = false
