# ==============================================================================
# glide-ng Preset: Myth: The Fallen Lords (1997 — HQ: 4x MSAA + Linear)
# Recommended for: Smooth bridge arches, minimap frustum lines, and terrain seams
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60
msaa = 4
presentation_filter = linear

[glide]
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
