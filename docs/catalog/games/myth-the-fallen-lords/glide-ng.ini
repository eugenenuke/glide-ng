# ==============================================================================
# glide-ng Preset: Myth: The Fallen Lords (1997 — Win32 Glide 2.x)
# Recommended for: MYTH_TFL.EXE (3Dfx renderer selected in Preferences)
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60
msaa = 1
presentation_filter = nearest

[glide]
# Keep gamma app-controlled (Myth exposes a live 3Dfx Gamma slider inside the
# Preferences screen via grGammaCorrectionValue). Preserve full 24-bit gradient
# shading across soft terrain shadow maps and water transitions.
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
