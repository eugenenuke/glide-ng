# ==============================================================================
# glide-ng Preset: Myth: The Fallen Lords (1997 — CPU Software AVX2 / AVX-512)
# Recommended for: Systems without a 32-bit Vulkan/OpenGL GPU driver
# ==============================================================================

[core]
backend = software

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60
msaa = 1
presentation_filter = nearest

[glide]
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
