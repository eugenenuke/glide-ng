# ==============================================================================
# glide-ng Preset: Myth: The Fallen Lords (1997 — Voodoo Graphics SST-1)
# Recommended for: Authentic 1997 4 MB / single-TMU Voodoo1 board profile
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = VoodooGraphics
api_version = 2.48

[display]
vsync = true
max_fps = 60
msaa = 1
presentation_filter = nearest

[glide]
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
