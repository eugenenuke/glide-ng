# ==============================================================================
# glide-ng Preset: NASCAR Racing 3 (1999 — HQ: 4x MSAA + Linear)
# Recommended for: Smooth catch-fence cables, car roofs, and grandstand towers
# Note: On CPU Vulkan adapters (llvmpipe) with high core counts, set
#       LP_NUM_THREADS=4 to keep 32-bit process VA usage within limits.
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60
msaa = 4
presentation_filter = linear

[glide]
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
