# ==============================================================================
# glide-ng Preset: NASCAR Racing 3 (1999 — Win32 Glide 2.x)
# Recommended for: NASCAR Racing 3.exe (v1.2.0.4) + 3dfxdll.dll -> glide2x.dll
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60
msaa = 1
presentation_filter = nearest

[glide]
# Preserve smooth 24-bit sky domes, cloud shading, and translucent HUD boxes.
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
