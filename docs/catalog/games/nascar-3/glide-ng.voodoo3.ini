# ==============================================================================
# glide-ng Preset: NASCAR Racing 3 (1999 — Voodoo3 Profile)
# Recommended for: 16 MB Voodoo3 hardware reporting with Glide 2.x 3dfxdll.dll
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo3
api_version = 2.60

[display]
vsync = true
max_fps = 60
msaa = 1
presentation_filter = nearest

[glide]
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
