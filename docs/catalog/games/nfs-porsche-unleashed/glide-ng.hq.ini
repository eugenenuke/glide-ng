# ==============================================================================
# glide-ng Preset: Need for Speed: Porsche Unleashed (2000 — HQ / 4x MSAA)
# Recommended for: Hardware Vulkan GPUs (smooths distant horizon & bodywork)
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2
api_version = 3.03

[display]
vsync = true
max_fps = 60
msaa = 4
presentation_filter = linear

[glide]
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
