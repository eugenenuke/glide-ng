# ==============================================================================
# glide-ng Preset: Need for Speed: Porsche Unleashed (2000 — Win32 Glide 3.x)
# Recommended for: nfs5.exe + voodoo2z.dll (Drivers/glide3x) -> glide3x.dll
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2
api_version = 3.03

[display]
vsync = true
max_fps = 60
msaa = 1
presentation_filter = nearest

[glide]
# Keep gamma app-controlled (NFSPU loads 256-entry LUTs via grLoadGammaTable)
# and preserve full 24-bit gradient precision without 16-bit dither subtraction.
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
