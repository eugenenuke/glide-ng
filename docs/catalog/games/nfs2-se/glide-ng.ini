# ==============================================================================
# glide-ng Preset: Need for Speed II: Special Edition (1997 — Win32 Glide 2.x)
# Recommended for: NFS2SEA.EXE (3dfx Glide edition) -> glide2x.dll
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60
msaa = 1
presentation_filter = nearest

[glide]
# Preserve full 24-bit color gradients on dusk/night twilight skies and
# translucent headlight pools / rain streaks without 16-bit dither banding.
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
