# ==============================================================================
# glide-ng Preset: Need for Speed III: Hot Pursuit (1998 — Win32 Glide 2.x)
# Recommended for: nfs3.exe -voodoo2 (voodoo2a.dll) -> glide2x.dll
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60
msaa = 1
presentation_filter = nearest

[glide]
# Preserve smooth 24-bit gradients on cloud horizons, atmospheric table fog,
# translucent menu emblems, and specular car bodywork reflections.
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
