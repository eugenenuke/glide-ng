# ==============================================================================
# glide-ng Preset: Need for Speed III: Hot Pursuit (1998 — Voodoo1 SST-1)
# Recommended for: nfs3.exe -voodoo (voodooa.dll) single-TMU Voodoo Graphics
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = VoodooGraphics
api_version = 2.48

[display]
vsync = true
max_fps = 60
msaa = 1
presentation_filter = nearest

[glide]
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
