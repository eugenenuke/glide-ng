# ==============================================================================
# glide-ng Preset: Outlaws (1997 — HQ / 4x MSAA)
# Recommended for: olwin.exe with LECGL23.DLL (Glide 2.3) or LECGLIDE.DLL (2.11)
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60
msaa = 4
presentation_filter = linear

[glide]
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
