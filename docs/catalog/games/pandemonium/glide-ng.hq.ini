# ==============================================================================
# glide-ng Preset: Pandemonium! (1997 — HQ / 4x MSAA)
# Recommended for: PANDY3.EXE on an 800x600 or 1280x960 Wine virtual desktop
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = VoodooGraphics
api_version = 2.11

[display]
vsync = true
max_fps = 60
msaa = 4
presentation_filter = linear

[glide]
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
