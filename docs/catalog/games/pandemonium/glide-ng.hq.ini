# ==============================================================================
# glide-ng Preset: Pandemonium! (1997 — HQ / 4x MSAA)
# Recommended for: PANDY3.EXE on an 800x600 or 1280x960 Wine virtual desktop
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = VoodooGraphics
api_version = 2.11

[display]
vsync = true
# Retail PANDY3.EXE alternates 33/34 ms per frame (30 FPS). Keeping max_fps = 30
# maintains authentic gameplay speed for both timer-patched and No-CD builds.
max_fps = 30
msaa = 4
presentation_filter = linear

[glide]
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
