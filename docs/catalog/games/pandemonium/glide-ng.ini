# ==============================================================================
# glide-ng Preset: Pandemonium! (1997 — Win32 Glide 2.11)
# Recommended for: PANDY3.EXE with glide-ng's Win32 glide.dll
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = VoodooGraphics
api_version = 2.11

[display]
vsync = true
max_fps = 60
msaa = 1
presentation_filter = nearest

[glide]
# Keep gamma app-controlled (linear 1.0 default) — matches PANDY3.BAT's
# SST_RGAMMA=1.0 / SST_GGAMMA=1.0 / SST_BGAMMA=1.0 settings.
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
