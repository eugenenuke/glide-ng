# ==============================================================================
# glide-ng Preset: Pandemonium! (1997 — Software Reference)
# Recommended for: Hosts without a 32-bit hardware Vulkan/OpenGL GPU driver
# ==============================================================================

[core]
backend = software

[hardware]
card_model = VoodooGraphics
api_version = 2.11

[display]
vsync = true
# Retail PANDY3.EXE alternates 33/34 ms per frame (30 FPS). Keeping max_fps = 30
# maintains authentic gameplay speed for both timer-patched and No-CD builds.
max_fps = 30
msaa = 1

[glide]
no_dither_sub = true

[software]
simd = auto
