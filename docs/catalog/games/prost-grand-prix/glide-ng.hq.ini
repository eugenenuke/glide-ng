# ==============================================================================
# glide-ng Preset: Prost Grand Prix — Enhanced (4x MSAA)
# Recommended for: PGP.EXE (640x480x16) on Vulkan / OpenGL ES
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = VoodooGraphics
api_version = 2.48

[display]
vsync = true
max_fps = 60
msaa = 4
presentation_filter = linear

[glide]
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
