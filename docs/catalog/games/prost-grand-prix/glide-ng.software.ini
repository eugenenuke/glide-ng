# ==============================================================================
# glide-ng Preset: Prost Grand Prix (1998 — DOS 3dfx, CPU Software Fallback)
# Pure-CPU reference rasterizer (requires no host Vulkan / OpenGL ES driver)
# ==============================================================================

[core]
backend = software

[hardware]
card_model = VoodooGraphics
api_version = 2.48

[display]
vsync = false
max_fps = 60

[software]
# Options: auto, scalar, avx2, avx512
simd = auto
# Options: none, analytical, ssaa (2x2 supersampling)
aa = none

[glide]
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
