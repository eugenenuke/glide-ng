# ==============================================================================
# glide-ng Preset: Quake II — HQ / 4x MSAA + Linear (Voodoo1, gamma = 1.3)
# Recommended for hardware Vulkan GPUs with retail Nov 1997 3dfxgl.dll
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = VoodooGraphics
api_version = 2.48

[display]
vsync = true
max_fps = 60
msaa = 4
presentation_filter = linear

[glide]
gamma = 1.3
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
