# ==============================================================================
# glide-ng Preset: Quake II (1997 — Win32 3dfx MiniGL 3dfxgl.dll -> glide2x.dll)
# Uses authentic Voodoo Graphics (SST-1) profile required by the retail Nov 1997
# 3dfxgl.dll shipped with Quake II v3.20 (gamma = 1.3 lifts warm lightmaps).
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = VoodooGraphics
api_version = 2.48

[display]
vsync = true
max_fps = 60
msaa = 1
presentation_filter = nearest

[glide]
gamma = 1.3
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
