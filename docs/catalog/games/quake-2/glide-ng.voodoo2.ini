# ==============================================================================
# glide-ng Preset: Quake II — Voodoo2 Dual-TMU Profile (MiniGL 1.4x / 800x600)
# For use with a 1998+ Voodoo2-capable 3dfx MiniGL driver (e.g. 3dfxgl 1.4x),
# unlocking single-pass GL_SGIS_multitexture and native 800x600 (gl_mode 4).
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60
msaa = 4
presentation_filter = linear

[glide]
gamma = 1.3
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
