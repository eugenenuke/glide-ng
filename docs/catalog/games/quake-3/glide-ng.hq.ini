# ==============================================================================
# glide-ng Preset: Quake III Arena — HQ / 4x MSAA + Linear (Voodoo3)
# Recommended for hardware Vulkan GPUs at 800x600 / 1024x768 with 3dfxVGL.dll
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo3
api_version = 3.10

[display]
vsync = true
max_fps = 60
msaa = 4
presentation_filter = linear

[glide]
gamma = 1.0
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
