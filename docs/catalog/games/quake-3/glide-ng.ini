# ==============================================================================
# glide-ng Preset: Quake III Arena — Authentic Baseline (Voodoo3, 1x)
# Verified with 3dfxVGL.dll (3dfx OpenGL 1.1 ICD) -> glide3x.dll (Glide 3.10)
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo3
api_version = 3.10

[display]
vsync = true
max_fps = 60
msaa = 1
presentation_filter = nearest

[glide]
gamma = 1.0
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
