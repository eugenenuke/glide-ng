# ==============================================================================
# glide-ng Preset: Quake III Arena — CPU Software Rasterizer (2x2 SSAA)
# Zero-GPU fallback using AVX2/AVX-512 SIMD with 3dfxVGL.dll -> glide3x.dll
# ==============================================================================

[core]
backend = software

[hardware]
card_model = Voodoo3
api_version = 3.10

[display]
vsync = true
max_fps = 60
presentation_filter = linear

[software]
# Use 'ssaa' for smooth edges (or 'none' for lower CPU load / higher FPS):
aa = ssaa

[glide]
gamma = 1.0
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
