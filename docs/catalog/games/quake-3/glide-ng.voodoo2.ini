# ==============================================================================
# glide-ng Preset: Quake III Arena — Voodoo2 (CVG, 3.03, dual-TMU 16 MB)
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2
api_version = 3.03

[display]
vsync = true
max_fps = 60
msaa = 1
presentation_filter = linear

[glide]
gamma = 1.0
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
