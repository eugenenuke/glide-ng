# ==============================================================================
# glide-ng Preset: Quake III Arena — Voodoo5 (VSA-100, 64 MB, PIXEXT/COMBINE)
# Enables 3dfxVGL.dll "3Dfx/Voodoo5 SLI/2 TMUs/64 MB" renderer mode
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo5
api_version = 3.10

[display]
vsync = true
max_fps = 60
msaa = 4
presentation_filter = linear

[glide]
gamma = 1.0
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
