# ==============================================================================
# glide-ng Preset: Quake / GLQuake — HQ / 4x MSAA + Linear (gamma = 1.7)
# Recommended for hardware Vulkan GPUs with 3dfx MiniGL (opengl32.dll)
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = VoodooGraphics
api_version = 2.48

[display]
vsync = true
max_fps = 60
msaa = 4
presentation_filter = linear

[glide]
gamma = 1.7
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
