# ==============================================================================
# glide-ng Preset: Quake / GLQuake (1996/1997 — Win32 via 3dfx MiniGL)
# Uses authentic Voodoo Graphics (SST-1) profile required by the Aug 1997
# 3dfx MiniGL opengl32.dll -> glide2x.dll, with authentic 1.7 SST-1 gamma.
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = VoodooGraphics
api_version = 2.48

[display]
vsync = true
max_fps = 60
msaa = 1
presentation_filter = nearest

[glide]
# Authentic Voodoo Graphics (SST-1) RAMDAC gamma default (GLQuake expects 1.7;
# linear 1.0 looks noticeably too dark compared to original 3dfx hardware).
gamma = 1.7
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
