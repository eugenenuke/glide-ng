# ==============================================================================
# glide-ng Preset: Quake / GLQuake — CPU Software Rasterizer (2x2 SSAA)
# Zero-GPU fallback using AVX2/AVX-512 SIMD with authentic gamma = 1.7
# ==============================================================================

[core]
backend = software

[hardware]
card_model = VoodooGraphics
api_version = 2.48

[display]
vsync = true
max_fps = 60
presentation_filter = linear

[software]
# Use 'ssaa' for smooth edges (or 'none' for lower CPU load / higher FPS):
aa = ssaa

[glide]
gamma = 1.7
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
