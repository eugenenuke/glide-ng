# ==============================================================================
# glide-ng Preset: Quake / GLQuake — Voodoo2 Profile (for MiniGL 1.4x+)
# Note: Only compatible with 1998+ MiniGL 1.4x (e.g. Half-Life's 3dfxgl.dll).
# The bundled Aug 1997 Voodoo1 MiniGL rejects Voodoo2; use glide-ng.ini for it.
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60
msaa = 1
presentation_filter = nearest

[glide]
gamma = 1.7
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
