# ==============================================================================
# glide-ng Preset: The Elder Scrolls Adventures: Redguard (HQ / 4x MSAA)
# Recommended for: RGFX.EXE at native 800x600 ([3dfx] resolution=8 in SYSTEM.INI)
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60
# Smooths sabers, ship rigging, and low-poly character silhouettes; Pause Book
# grLfbReadRegion thumbnails resolve cleanly under 4x MSAA.
msaa = 4
presentation_filter = linear

[glide]
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
