# ==============================================================================
# glide-ng Preset: The Elder Scrolls Adventures: Redguard (1998)
# Recommended for: Unmodified retail RGFX.EXE under DOSBox Glide pass-through
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60
msaa = 1
presentation_filter = nearest

[glide]
# Keep gamma app-controlled (linear 1.0 default) — matches authentic SST-1
# hardware output while preserving in-game fade transitions.
# Preserve full 24-bit color precision across smooth sunset fog gradients.
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
