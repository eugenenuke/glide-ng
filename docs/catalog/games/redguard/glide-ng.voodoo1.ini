# ==============================================================================
# glide-ng Preset: The Elder Scrolls Adventures: Redguard (Voodoo1 SST-1)
# Recommended for: Authentic 640x480 single-TMU Voodoo Graphics profile
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = VoodooGraphics
api_version = 2.48

[display]
vsync = true
max_fps = 60
msaa = 1
presentation_filter = nearest

[glide]
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
