# ==============================================================================
# glide-ng Preset: Shadow Warrior (1997 — 3dfx DOS Patch v1.1)
# Recommended for: SW3DFX.EXE (640x480 / 800x600) under DOSBox
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60
# Keep msaa = 1: Shadow Warrior's 3dfx Build Engine draws floor/ceiling spans
# as 1-pixel right-triangle strips without calling grBufferClear() in-game.
# Higher MSAA/SSAA sample counts leave un-overwritten subsamples from prior
# frames ghosted across the viewport.
msaa = 1
presentation_filter = nearest

[glide]
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
