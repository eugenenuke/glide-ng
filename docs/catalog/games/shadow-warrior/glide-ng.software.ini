# ==============================================================================
# glide-ng Preset: Shadow Warrior — CPU Software Backend
# Recommended for: SW3DFX.EXE on hosts without a hardware Vulkan/GLES GPU
# ==============================================================================

[core]
backend = software

[software]
# Auto-selects AVX-512 (Zen 4+) -> AVX2 -> Scalar
simd = auto
# Do NOT enable aa = ssaa: Shadow Warrior's 1px-tall right-triangle span strips
# require 1x sampling so all pixels overwrite cleanly without frame ghosting.

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60
msaa = 1
presentation_filter = nearest

[glide]
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
