# ==============================================================================
# glide-ng Preset: Shadow Warrior (Authentic SST-1 Voodoo Graphics)
# Recommended for: SW3DFX.EXE (640x480) on single-TMU SST-1 profile
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = VoodooGraphics
api_version = 2.48

[display]
vsync = true
max_fps = 60
msaa = 1
presentation_filter = nearest

[glide]
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
