# ==============================================================================
# glide-ng Preset: Tie Break Tennis — Enhanced (4x MSAA)
# Recommended for: TENNIS.EXE (640x480x16) on Vulkan / OpenGL ES
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60
msaa = 4
presentation_filter = linear

[glide]
ignore_reopen = true
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
