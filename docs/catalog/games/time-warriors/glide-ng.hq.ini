# ==============================================================================
# glide-ng Preset: Time Warriors (1997 — HQ / 4x MSAA)
# Recommended for: _ST_3DFX.EXE with smooth edges on character/arena polygons
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = VoodooGraphics
api_version = 2.11

[display]
vsync = true
max_fps = 60
msaa = 4
presentation_filter = linear

[glide]
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
