# ==============================================================================
# glide-ng Preset: Time Warriors (1997 — Win32 Glide 2.11)
# Recommended for: _ST_3DFX.EXE with glide-ng's Win32 glide.dll
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = VoodooGraphics
api_version = 2.11

[display]
vsync = true
max_fps = 60
msaa = 1
presentation_filter = nearest

[glide]
# Game calls grGammaCorrectionValue(1.0f) at startup; keep linear precision.
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
