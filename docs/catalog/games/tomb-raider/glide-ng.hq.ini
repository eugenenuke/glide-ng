# ==============================================================================
# glide-ng Preset: Tomb Raider — Enhanced Visuals (4x MSAA + Crisp Scaling)
# Recommended for: TOMB.EXE (Jun 1997 3dfx Rush patch) on Vulkan / OpenGL ES GPUs
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60
# 4x hardware MSAA smooths polygon silhouettes; nearest keeps UI fonts razor-sharp.
# Change presentation_filter to linear if you prefer softer non-integer scaling.
msaa = 4
presentation_filter = nearest

[glide]
# Eliminates 16-bit RGB565 dithering banding in dark caves and gradients
no_dither_sub = true
# force_trilinear is intentionally omitted: Tomb Raider uses point-sampled font
# atlases and packed 64x64-in-256x256 world atlases whose mipmaps bleed neighbor
# tiles across floor and wall edges. Keep in-game Detail Levels on Normal.
# Leave gamma unset so native gamma (1.5), screen fades, and the in-game Gamma
# slider work; uncomment gamma = 1.0 for a darker modern-LCD look:
# gamma = 1.0
