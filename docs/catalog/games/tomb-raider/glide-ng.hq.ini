# ==============================================================================
# glide-ng Preset: Tomb Raider — Enhanced Visuals (4x MSAA + Trilinear + Linear)
# Recommended for: TOMB.EXE (Jun 1997 3dfx Rush patch) on Vulkan / OpenGL ES GPUs
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60
# 4x hardware MSAA smooths polygon silhouettes; linear scaling softens 1px seams
msaa = 4
presentation_filter = linear

[glide]
gamma = 1.7
no_dither_sub = true
force_trilinear = true
