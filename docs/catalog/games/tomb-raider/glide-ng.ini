# ==============================================================================
# glide-ng Preset: Tomb Raider (1996 / 3dfx Rush 1997 DOS Patch)
# Recommended for: TOMB.EXE (Jun 1997 3dfx Rush patch) via DOSBox Glide pass-through (GLIDE2X.OVL)
# ==============================================================================

[core]
backend = vulkan

[hardware]
# Authentic 1996-1997 SST-1 profile (4 MB FB, 1x 2 MB TMU, Glide 2.48)
card_model = VoodooGraphics
api_version = 2.48

[display]
vsync = true
max_fps = 60
# Crisp nearest-neighbor scaling preserves point-sampled HUD and menu text
presentation_filter = nearest

[glide]
# Leave gamma unset so Tomb Raider's native grGammaCorrectionValue(1.5), smooth
# fade transitions, and in-game Ring Menu -> Gamma slider all work naturally.
# Uncomment gamma = 1.0 for a darker modern-LCD look (matching OpenGlide):
# gamma = 1.0
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
