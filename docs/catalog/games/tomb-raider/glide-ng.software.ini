# ==============================================================================
# glide-ng Preset: Tomb Raider — High-Speed CPU Software Backend
# Recommended for: TOMB.EXE (Jun 1997 3dfx Rush patch) on hosts without a hardware Vulkan/GL GPU
# ==============================================================================

[core]
backend = software

[hardware]
card_model = VoodooGraphics
api_version = 2.48

[display]
vsync = true
max_fps = 60
presentation_filter = nearest

[glide]
# Leave gamma unset for native gamma (1.5), smooth fades, and in-game Gamma slider.
# Uncomment gamma = 1.0 for a darker modern-LCD look:
# gamma = 1.0

[software]
# Automatically selects AVX-512 (if available), AVX2+FMA, or scalar fallback
simd = auto
