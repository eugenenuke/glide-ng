# ==============================================================================
# glide-ng Preset: Turok 2: Seeds of Evil — HQ / 4x MSAA + Linear Presentation
# Recommended for: Hardware Vulkan GPUs (800x600 / 640x480)
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2
api_version = 3.03

[display]
vsync = true
max_fps = 60
msaa = 4
presentation_filter = linear

[glide]
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
