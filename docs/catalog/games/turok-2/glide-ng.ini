# ==============================================================================
# glide-ng Preset: Turok 2: Seeds of Evil (1999 — Win32 Glide 3.x)
# Recommended for: Turok2.exe / Turok2MP.exe with Video_3DFx.dll -> glide3x.dll
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2
api_version = 3.03

[display]
vsync = true
max_fps = 60
msaa = 1
presentation_filter = nearest

[glide]
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
