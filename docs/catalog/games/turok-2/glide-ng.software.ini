# ==============================================================================
# glide-ng Preset: Turok 2: Seeds of Evil — CPU Software Rasterizer (2x2 SSAA)
# Zero-GPU fallback using AVX2/AVX-512 SIMD with full lower-left origin & fog
# ==============================================================================

[core]
backend = software

[hardware]
card_model = Voodoo2
api_version = 3.03

[display]
vsync = true
max_fps = 60
presentation_filter = linear

[software]
# Use 'ssaa' for smooth edges (or 'none' for lower CPU load / higher FPS):
aa = ssaa

[glide]
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
