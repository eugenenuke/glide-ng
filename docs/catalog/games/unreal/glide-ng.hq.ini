# ==============================================================================
# glide-ng Preset: Unreal (1998 — High Quality: 4x MSAA + Linear)
# Recommended for: Sharp edges on castle architecture, ramps, and sky spires
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60
msaa = 4
presentation_filter = linear

[glide]
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
