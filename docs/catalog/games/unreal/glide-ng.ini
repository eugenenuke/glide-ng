# ==============================================================================
# glide-ng Preset: Unreal (1998 — Win32 Glide 2.x)
# Recommended for: Unreal.exe (v226f or retail v200) with GlideDrv.dll -> glide2x.dll
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = true
max_fps = 60
msaa = 1
presentation_filter = nearest

[glide]
# Keep gamma app-controlled (Unreal calls grGammaCorrectionValue directly from
# its Brightness slider; default 0.5 -> ~1.25). Preserve full 24-bit color
# precision on dark stone walls and dynamic lightmaps.
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
