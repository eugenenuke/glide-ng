# ==============================================================================
# glide-ng Preset: Unreal (1998 — Voodoo Graphics SST-1 Single-TMU)
# Recommended for: Authentic 1996-era Voodoo1 single-TMU multipass rendering
# Note: Set FullscreenViewportX=640 / FullscreenViewportY=480 in Unreal.ini
# ==============================================================================

[core]
backend = vulkan

[hardware]
card_model = VoodooGraphics
api_version = 2.48

[display]
vsync = true
max_fps = 60
msaa = 1
presentation_filter = nearest

[glide]
no_dither_sub = true
# Uncomment to skip the automatic startup splash animation:
# no_splash = true
