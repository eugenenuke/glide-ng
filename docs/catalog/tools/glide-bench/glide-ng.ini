# ==============================================================================
# glide-ng Preset: glide2_bench / glide_bench.exe (Glide 2.x — Voodoo2 Uncapped)
# Use via: GLIDE_NG_CONFIG=docs/catalog/tools/glide-bench/glide-ng.ini
# ==============================================================================

[core]
backend = vulkan
headless = false

[hardware]
card_model = Voodoo2
api_version = 2.56

[display]
vsync = false
max_fps = 0

[glide]
no_splash = true
swap_interval = 0

[software]
# Default is avx2; override with GLIDE_NG_SW_SIMD=avx512 or auto on Zen 4 / AVX-512 CPUs
simd = avx2
