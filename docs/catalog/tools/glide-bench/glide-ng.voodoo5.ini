# ==============================================================================
# glide-ng Preset: glide3_bench (Glide 3.x — Voodoo5 VSA-100 Uncapped)
# Enables all 14 scenes including stencil, ext_combine, texfmt, rtt, and tbuffer.
# Use via: GLIDE_NG_CONFIG=docs/catalog/tools/glide-bench/glide-ng.voodoo5.ini
# ==============================================================================

[core]
backend = vulkan
headless = false

[hardware]
card_model = Voodoo5
api_version = 3.10

[display]
vsync = false
max_fps = 0

[glide]
no_splash = true
swap_interval = 0

[software]
# Override with GLIDE_NG_SW_SIMD=avx512 or auto on Zen 4 / AVX-512 CPUs
simd = avx2
